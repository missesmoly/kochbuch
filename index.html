<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mein Kochbuch</title>

    <meta
        name="description"
        content="Mein persönliches digitales Kochbuch"
    >

    <link rel="stylesheet" href="style.css">
</head>


<body>

<header class="site-header">

    <div class="container header-inner">

        <a href="#" class="logo">
            Mein Kochbuch
        </a>


        <nav class="main-nav">

            <button
                class="nav-button active"
                data-view="recipes"
            >
                Rezepte
            </button>

            <button
                class="nav-button"
                data-view="weekly-plan"
            >
                Wochenplan
                <span
                    id="plan-count"
                    class="nav-count"
                >
                    0
                </span>
            </button>

            <button
                class="nav-button"
                data-view="shopping-list"
            >
                Einkaufsliste
            </button>

        </nav>

    </div>

</header>


<main>


    <!-- =========================================
         REZEPTE
         ========================================= -->

    <section
        id="recipe-view"
        class="view"
    >

        <section class="hero">

            <div class="container">

                <p class="eyebrow">
                    Persönliche Rezeptsammlung
                </p>

                <h1>
                    Was möchtest du heute kochen?
                </h1>


                <div class="search-wrapper">

                    <label
                        for="search"
                        class="visually-hidden"
                    >
                        Rezepte durchsuchen
                    </label>

                    <input
                        type="search"
                        id="search"
                        placeholder="Nach Rezepten oder Zutaten suchen …"
                        autocomplete="off"
                    >

                </div>


                <div
                    id="tag-filter"
                    class="tag-filter"
                >

                    <button
                        class="tag-button active"
                        data-tag="Alle"
                    >
                        Alle
                    </button>

                    <button
                        class="tag-button"
                        data-tag="Hauptgericht"
                    >
                        Hauptgericht
                    </button>

                    <button
                        class="tag-button"
                        data-tag="MealPrep"
                    >
                        MealPrep
                    </button>

                    <button
                        class="tag-button"
                        data-tag="Vegan"
                    >
                        Vegan
                    </button>

                    <button
                        class="tag-button"
                        data-tag="schnell"
                    >
                        Schnell
                    </button>

                    <button
                        class="tag-button"
                        data-tag="Dessert"
                    >
                        Dessert
                    </button>

                </div>

            </div>

        </section>


        <section class="section">

            <div class="container">

                <div class="section-heading">

                    <div>

                        <p class="eyebrow">
                            Sammlung
                        </p>

                        <h2>
                            Rezepte
                        </h2>

                    </div>


                    <span
                        id="recipe-count"
                        class="recipe-count"
                    ></span>

                </div>


                <div
                    id="recipe-grid"
                    class="recipe-grid"
                ></div>


                <p
                    id="no-results"
                    class="no-results"
                    hidden
                >
                    Keine passenden Rezepte gefunden.
                </p>

            </div>

        </section>

    </section>



    <!-- =========================================
         WOCHENPLAN
         ========================================= -->

    <section
        id="weekly-plan-view"
        class="view"
        hidden
    >

        <div class="container section">

            <div class="section-heading">

                <div>

                    <p class="eyebrow">
                        Planung
                    </p>

                    <h1>
                        Wochenplan
                    </h1>

                </div>


                <button
                    id="clear-plan"
                    class="button button-secondary"
                >
                    Plan leeren
                </button>

            </div>


            <p class="section-intro">
                Hier sammelst du die Gerichte,
                die du diese Woche kochen möchtest.
            </p>


            <div
                id="weekly-plan"
                class="weekly-plan"
            ></div>


            <div
                id="empty-plan"
                class="empty-state"
            >

                <p>
                    Noch keine Gerichte geplant.
                </p>

                <button
                    class="button button-primary"
                    data-go-to-recipes
                >
                    Rezepte ansehen
                </button>

            </div>

        </div>

    </section>



    <!-- =========================================
         EINKAUFSLISTE
         ========================================= -->

    <section
        id="shopping-list-view"
        class="view"
        hidden
    >

        <div class="container section">

            <div class="section-heading">

                <div>

                    <p class="eyebrow">
                        Aus deinem Wochenplan
                    </p>

                    <h1>
                        Einkaufsliste
                    </h1>

                </div>


                <button
                    id="clear-shopping-list"
                    class="button button-secondary"
                >
                    Haken zurücksetzen
                </button>

            </div>


            <div
                id="shopping-list"
                class="shopping-list"
            ></div>

        </div>

    </section>

</main>



<!-- =========================================
     REZEPT-MODAL
     ========================================= -->

<div
    id="recipe-modal"
    class="modal"
    hidden
    aria-hidden="true"
>

    <div
        class="modal-backdrop"
        data-close-modal
    ></div>


    <div
        class="modal-content"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-recipe-title"
    >

        <button
            id="close-recipe-modal"
            class="modal-close"
            aria-label="Rezept schließen"
        >
            ×
        </button>


        <div
            id="recipe-modal-body"
            class="recipe-modal-body"
        ></div>

    </div>

</div>



<footer class="site-footer">

    <div class="container">

        <p>
            Mein Kochbuch
        </p>

    </div>

</footer>


<script src="app.js"></script>

</body>
</html>

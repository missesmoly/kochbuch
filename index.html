<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kochbuch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="header-inner">
            <h1>Kochbuch</h1>
            <p>Meine Lieblingsrezepte</p>
        </div>
    </header>

    <main class="container">
        <section class="intro">
            <h2>Rezepte</h2>
            <input
                type="search"
                id="search"
                placeholder="Rezepte durchsuchen ..."
                aria-label="Rezepte durchsuchen"
            >
        </section>

        <section id="recipe-list" class="recipe-grid">
            <p class="loading">Rezepte werden geladen ...</p>
        </section>
    </main>

    <div id="recipe-modal" class="modal hidden">
        <div class="modal-content">
            <button id="close-modal" class="close-button" aria-label="Schließen">
                ×
            </button>

            <div id="recipe-detail"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
